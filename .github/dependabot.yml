---
version: 2

updates:
  - package-ecosystem: pip
    allow:
      - dependency-type: all
    directory: /
    schedule:
      interval: daily
    open-pull-requests-limit: 10
    # doc8 caps Docutils at 0.21.2, and doccmd's MyST dependency caps it below 0.23.
    # Remove this ignore when both tools support newer Docutils versions.
    ignore:
      - dependency-name: docutils
        versions: ['>=0.22']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: daily

  # Dependabot cannot read prek.toml yet:
  # https://github.com/dependabot/dependabot-core/issues/14624
